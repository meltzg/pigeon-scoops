name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: linux
    env:
      CI_ENV: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        # Fully qualified: only a subset of actions is mirrored on
        # data.forgejo.org. setup-java's temurin path talks to Adoptium, not
        # the GitHub API, so it works on the forge (see the setup-actions
        # trap in usb-ci docs/migration.md).
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Install Clojure CLI
        # Not setup-clojure: it authenticates against GitHub with the job's
        # token, which on the forge is a Forgejo token GitHub rejects. The
        # official version-pinned installer involves no GitHub at all.
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh
      - name: Formatting
        run: clojure -M:cljfmt check
      - name: Linting
        run: clojure -M:clj-kondo --lint src --lint test --lint dev

  test:
    runs-on: linux
    env:
      CI_ENV: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: https://github.com/actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Install Clojure CLI
        run: |
          curl -sLO https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x linux-install-1.12.4.1618.sh
          ./linux-install-1.12.4.1618.sh
      - name: Install Node 24
        # Not setup-node: it resolves versions through the GitHub API with
        # the job's token, the same trap as setup-clojure. NodeSource's
        # setup script is a plain download.
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -yq nodejs
          corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run tests
        run: yarn test
